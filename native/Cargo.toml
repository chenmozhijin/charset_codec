[package]
name = "charset_codec_native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "cdylib"]

[profile.dev]
# The FFI export layer converts unexpected panics into diagnostic errors with
# catch_unwind, so the build must allow unwinding.
panic = "unwind"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "unwind"
